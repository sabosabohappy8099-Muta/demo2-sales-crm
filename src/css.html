<style>
  /* ===== 基本の色・サイズ(白基調+グリーン1色) ===== */
  :root {
    --green: #2e7d32;
    --green-dark: #1b5e20;
    --green-soft: #e8f5e9;
    --green-line: #c8e6c9;
    --text: #1f2a24;
    --muted: #66736b;
    --line: #e4e9e5;
    --bg: #f6f8f6;
    --card: #ffffff;
    --today: #fff8e1;
    --today-line: #f9a825;
    --danger: #c62828;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(20, 40, 25, 0.08);
    --tap: 48px; /* 片手で押しやすい最小の高さ */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ===== 画面上部 ===== */
  .app-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 24px;
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-logo { font-size: 28px; }
  .brand-company { font-size: 12px; color: var(--muted); }
  .brand-tool { font-size: 18px; font-weight: 700; color: var(--green-dark); }

  .staff-picker { display: flex; flex-direction: column; min-width: 180px; }
  .field-label { font-size: 12px; color: var(--muted); }

  .progress-box { min-width: 220px; }
  .progress-text { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .progress-text strong { font-size: 18px; color: var(--green-dark); }
  .progress { height: 10px; border-radius: 99px; background: var(--green-soft); overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .4s; }
  .progress-box.done .progress-bar { background: var(--today-line); }

  /* ===== 入力部品・ボタン ===== */
  .select, .input {
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
  }
  .select:focus, .input:focus { outline: 2px solid var(--green-line); border-color: var(--green); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: var(--tap);
    padding: 0 18px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--green-dark); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: var(--card); color: var(--text); border-color: var(--line); font-weight: 500; }
  .btn-ghost:hover { background: var(--green-soft); }

  /* ===== メインタブ ===== */
  .main-tabs {
    display: flex;
    gap: 4px;
    padding: 0 12px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .main-tab {
    flex: 0 0 auto;
    min-height: var(--tap);
    padding: 0 18px;
    border: 0;
    border-bottom: 3px solid transparent;
    background: none;
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
  }
  .main-tab.active { color: var(--green-dark); border-bottom-color: var(--green); }

  .app-main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ===== サブタブ(件数バッジ付き) ===== */
  .sub-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .sub-tab {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 16px;
    border: 1px solid var(--line);
    border-radius: 99px;
    background: var(--card);
    font-weight: 700;
    cursor: pointer;
  }
  .sub-tab .badge {
    min-width: 24px;
    padding: 0 7px;
    border-radius: 99px;
    background: var(--green-soft);
    color: var(--green-dark);
    font-size: 12px;
    line-height: 22px;
    text-align: center;
  }
  .sub-tab.active { background: var(--green); border-color: var(--green); color: #fff; }
  .sub-tab.active .badge { background: rgba(255, 255, 255, .25); color: #fff; }

  /* ===== 検索・並び替え ===== */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; }
  .toolbar .search { flex: 1 1 240px; }
  .sort-group { display: flex; gap: 8px; }
  #sortDirBtn { min-height: 44px; padding: 0 14px; }

  .list-summary { margin: 4px 2px 10px; font-size: 13px; color: var(--muted); }
  .list-summary strong { color: var(--today-line); }

  /* ===== 架電リストの各行 ===== */
  .prospect-list { display: flex; flex-direction: column; gap: 10px; }
  .prospect-card {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px 18px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .prospect-card.is-today { background: var(--today); border-left-color: var(--today-line); }

  .pc-company { font-size: 16px; font-weight: 700; word-break: break-all; }
  .pc-meta { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .pc-meta span + span::before { content: "・"; margin: 0 2px; }

  .pc-info { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 13px; color: var(--muted); text-align: right; }
  .pc-next.is-today { color: #8d5a00; font-weight: 700; }

  .today-chip {
    display: inline-block;
    margin-left: 6px;
    padding: 0 8px;
    border-radius: 99px;
    background: var(--today-line);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    vertical-align: 2px;
  }

  .status-badge { display: inline-block; padding: 1px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
  .status-0 { background: #eceff1; color: #455a64; }   /* 未架電 */
  .status-1 { background: #fff3e0; color: #e65100; }   /* 不在・再架電 */
  .status-2 { background: #e3f2fd; color: #1565c0; }   /* 見込み */
  .status-3 { background: #ede7f6; color: #5e35b1; }   /* 資料送付済み */
  .status-4 { background: var(--green-soft); color: var(--green-dark); } /* 成約 */
  .status-5 { background: #ffebee; color: var(--danger); } /* NG */

  .pc-actions { display: flex; gap: 8px; }
  .fav-btn {
    width: var(--tap);
    height: var(--tap);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: #b0bab3;
    font-size: 22px;
    cursor: pointer;
  }
  .fav-btn.on { color: #f9a825; border-color: #ffe082; background: #fffde7; }
  .call-btn { min-width: 108px; font-size: 16px; }

  /* ===== 空の状態 ===== */
  .empty-card {
    padding: 40px 20px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    color: var(--muted);
    text-align: center;
  }
  .empty-icon { font-size: 36px; }

  /* ===== 読み込み表示 ===== */
  .loading {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .55);
  }
  .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid var(--green-soft);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== トースト通知 ===== */
  .toast-area {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 3100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: min(92vw, 420px);
    transform: translateX(-50%);
  }
  .toast {
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--green-dark);
    color: #fff;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
    animation: toast-in .2s ease-out;
  }
  .toast.error { background: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

  /* ===== 共通のカード・入力欄 ===== */
  .card {
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card h3 { margin: 0; font-size: 16px; }
  .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  textarea.input { resize: vertical; min-height: 80px; }
  .req { padding: 0 6px; border-radius: 6px; background: #ffebee; color: var(--danger); font-size: 11px; font-weight: 700; }
  .btn-sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
  .btn-lg { min-height: 56px; font-size: 17px; }
  .btn-block { width: 100%; }

  /* ===== 架電モード:上部バー ===== */
  .call-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    margin: -16px -16px 14px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  .call-bar-title { flex: 1 1 200px; min-width: 0; }
  .call-company { font-size: 18px; font-weight: 700; word-break: break-all; }
  .call-sub { font-size: 13px; color: var(--muted); }
  .call-timer {
    padding: 6px 12px;
    border-radius: 10px;
    background: var(--green-soft);
    color: var(--green-dark);
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .call-timer.stopped { background: #eceff1; color: var(--muted); }
  .call-bar-actions { display: flex; gap: 8px; }
  .call-dial { text-decoration: none; font-size: 16px; }

  /* ===== 架電モード:3列(PC)/縦積み(スマホ) ===== */
  .call-grid {
    display: grid;
    grid-template-columns: minmax(230px, 1fr) minmax(0, 1.7fr) minmax(260px, 1.2fr);
    gap: 14px;
    align-items: start;
  }
  .call-col { min-width: 0; }

  .info-list { margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
  .info-list dt { color: var(--muted); }
  .info-list dd { margin: 0; word-break: break-all; }
  .info-memo { margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: #fffde7; font-size: 14px; white-space: pre-wrap; }
  .history-title { margin: 8px 0 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .history-item { padding: 8px 10px; border-left: 3px solid var(--green-line); background: var(--bg); border-radius: 0 8px 8px 0; font-size: 13px; }
  .history-item .h-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); }
  .history-item .h-memo { margin-top: 2px; }
  .history-item.is-new { border-left-color: var(--green); background: var(--green-soft); }

  /* トークスクリプト:現在のステップを強調 */
  .script-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .script-step {
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 12px;
    opacity: .55;
    cursor: pointer;
    transition: opacity .2s, border-color .2s, background .2s;
    scroll-margin: 90px;
  }
  .script-step.done { opacity: .4; }
  .script-step.current { opacity: 1; border-color: var(--green); background: var(--green-soft); }
  .step-head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .step-no {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--line); font-size: 13px;
  }
  .script-step.current .step-no { background: var(--green); color: #fff; }
  .step-body { margin-top: 6px; font-size: 16px; line-height: 1.8; }
  .step-point { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, .7); font-size: 13px; color: var(--muted); }
  .script-step:not(.current) .step-point { display: none; }

  /* 切り返し */
  .rebuttal-buttons { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 6px; }
  .rebuttal-btn {
    min-height: var(--tap);
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    cursor: pointer;
  }
  .rebuttal-btn:hover { background: var(--green-soft); }
  .rebuttal-btn.active { background: var(--green); border-color: var(--green); color: #fff; }
  .rebuttal-detail { margin-bottom: 14px; padding: 12px 14px; border: 2px solid var(--green); border-radius: 12px; background: var(--green-soft); }
  .rebuttal-detail.empty { border-style: dashed; border-color: var(--line); background: var(--bg); color: var(--muted); }
  .rd-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 700; color: var(--green-dark); }
  .rd-source { font-size: 12px; font-weight: 500; color: var(--muted); }
  .rd-talk { margin-top: 6px; font-size: 16px; line-height: 1.8; }
  .rd-next { margin-top: 8px; font-size: 13px; }
  .rd-next strong { color: var(--green-dark); }

  /* 架電結果 */
  .result-card, .done-card { margin-top: 14px; }
  .result-card h3 { margin-bottom: 12px; }
  .status-choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px; }
  .status-choice {
    min-height: 56px;
    padding: 6px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    font-weight: 700;
    line-height: 1.3;
    cursor: pointer;
  }
  .status-choice.selected { border-color: var(--green); background: var(--green); color: #fff; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .done-card { border: 2px solid var(--green); background: var(--green-soft); }
  .done-message { margin-bottom: 12px; font-size: 16px; font-weight: 700; color: var(--green-dark); }
  .done-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .done-actions .btn { flex: 1 1 200px; }

  .result-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .result-actions .btn { flex: 1 1 200px; }
  .result-actions #saveResultBtn { flex-grow: 2; }

  /* 架電モード:近隣の導入企業 */
  .nearby-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; background: var(--green-soft); font-size: 14px; }
  .nearby-box strong { font-size: 18px; color: var(--green-dark); }
  .nearby-box .btn { margin-left: auto; }

  /* 架電リストの「地図」ボタン */
  .map-btn { width: var(--tap); height: var(--tap); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: 20px; cursor: pointer; }
  .map-btn:disabled { opacity: .3; cursor: not-allowed; }

  /* ===== 地図検索 ===== */
  .map-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 14px; }
  .map-search { display: flex; gap: 8px; flex: 1 1 360px; }
  .map-search .input { flex: 1; min-width: 0; }
  .map-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
  .radius-control { display: flex; flex-direction: column; min-width: 220px; }
  .radius-control strong { font-size: 18px; color: var(--green-dark); }
  .radius-control input[type="range"] { width: 100%; height: 32px; accent-color: var(--green); }
  .layer-toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 14px; cursor: pointer; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--green); }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .2); }
  .dot-green { background: #2e7d32; }
  .dot-blue { background: #1e66d0; }
  .dot-red { background: #d32f2f; }

  .map-layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 14px; align-items: start; }
  .map-card { padding: 0; overflow: hidden; }
  .map { height: 68vh; min-height: 380px; }
  .map-result { max-height: 68vh; min-height: 380px; overflow: auto; }
  .map-center-label { margin-bottom: 8px; font-size: 13px; color: var(--muted); word-break: break-all; }
  .nearby-total strong { font-size: 40px; line-height: 1.2; color: var(--green-dark); }
  .plan-breakdown { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 14px; }
  .plan-row { display: grid; grid-template-columns: 90px 1fr 36px; align-items: center; gap: 8px; font-size: 13px; }
  .plan-bar { height: 10px; border-radius: 99px; background: var(--green-soft); overflow: hidden; }
  .plan-bar span { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .2s; }
  .plan-row .num { text-align: right; font-weight: 700; }
  .nearby-list { margin: 4px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .nearby-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 13px; cursor: pointer; }
  .nearby-item:hover { background: var(--green-soft); }
  .nearby-item .ni-name { font-weight: 700; }
  .nearby-item .ni-dist { white-space: nowrap; color: var(--green-dark); font-weight: 700; }
  .map-popup { font-size: 13px; line-height: 1.6; }
  .map-popup strong { font-size: 14px; }
  .leaflet-container { font: inherit; }

  /* ===== 資料送付ダイアログ ===== */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 2000; /* 地図(Leaflet)より手前に出す */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(20, 30, 24, .45);
  }
  .modal-card { display: flex; flex-direction: column; width: min(720px, 100%); max-height: calc(100vh - 32px); background: var(--card); border-radius: 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
  .modal-head, .modal-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; }
  .modal-head { border-bottom: 1px solid var(--line); }
  .modal-foot { justify-content: flex-end; border-top: 1px solid var(--line); }
  .modal-body { padding: 16px 18px; overflow: auto; }
  .icon-btn { width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; font-size: 18px; cursor: pointer; }
  .icon-btn:hover { background: var(--bg); }
  .material-choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 4px 0 14px; }
  .material-choice { min-height: var(--tap); padding: 8px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font-weight: 700; text-align: left; cursor: pointer; }
  .material-choice.selected { border-color: var(--green); background: var(--green-soft); color: var(--green-dark); }
  .send-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 12px; }
  .send-mode { display: flex; gap: 10px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
  .send-mode:has(input:checked) { border-color: var(--green); background: var(--green-soft); }
  .send-mode input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green); }
  .send-mode small { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .mail-note { margin-bottom: 8px; padding: 8px 12px; border-radius: 10px; background: #e3f2fd; color: #0d47a1; font-size: 13px; }
  .fax-note { padding: 8px 12px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 13px; }

  /* ===== 成果ダッシュボード ===== */
  .dash-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
  .segmented { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
  .seg-btn { min-height: 44px; min-width: 76px; padding: 0 16px; border: 0; border-radius: 10px; background: none; font-weight: 700; color: var(--muted); cursor: pointer; }
  .seg-btn.active { background: var(--green); color: #fff; }
  .dash-range { font-size: 13px; color: var(--muted); }
